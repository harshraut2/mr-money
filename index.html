
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#078a50">
<title>MR Money — रुपये का हिसाब</title>
<style>
:root{--g:#078a50;--p:#e7f7ef;--r:#d83b3b;--bg:#f3f8f5;--ink:#142019;--muted:#718078;--line:#d9e6df}
*{box-sizing:border-box}body{margin:0;padding:0 0 80px;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Devanagari",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;border-radius:12px;padding:12px;font-weight:bold}.top{background:linear-gradient(135deg,#079655,#087548);color:white;padding:25px 18px;border-radius:0 0 25px 25px}.top h1{margin:0;font-size:32px}.wrap{max-width:850px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.stat small{color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:5px}.green{color:var(--g)}.red{color:var(--r)}.title{font-size:21px;font-weight:bold;margin:18px 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.primary{background:var(--g);color:white}.soft{background:var(--p);color:var(--g)}.danger{background:#fdecec;color:var(--r)}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea,.field select,.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.customer{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:white;border:1px solid var(--line);margin-bottom:8px}.info{flex:1;min-width:0}.sub,small{color:var(--muted)}.name{font-size:17px;font-weight:bold}.bal{text-align:right}.record{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.record:last-child{border-bottom:0}.record small{display:block;margin-top:4px}.record-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.mini{padding:7px 9px;background:var(--p);color:var(--g);font-size:12px}.mini.red{background:#fdecec;color:var(--r)}.empty{text-align:center;color:var(--muted);padding:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;z-index:5}.nav{background:white;color:#68756e}.nav.on{background:var(--p);color:var(--g)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.sheet h2{margin-top:0}.modalBtns{display:flex;gap:8px;margin-top:14px}.modalBtns>*{flex:1}.note{background:#fff7d8;padding:10px;border-radius:10px;font-size:13px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#17201c;color:white;padding:12px;border-radius:12px;z-index:30;max-width:90%}
</style>
</head>
<body>
<header class="top"><h1>💰 MR Money</h1><div>आपका पूरा रुपये का हिसाब</div></header>
<main class="wrap">
<section id="home" class="page active">
<div class="grid">
<div class="card stat"><small>कुल जमा हुआ</small><b id="totPaid" class="green">₹0</b></div>
<div class="card stat"><small>कुल बचा है</small><b id="totDue" class="red">₹0</b></div>
<div class="card stat"><small>आज की कमाई</small><b id="dayIncome" class="green">₹0</b></div>
<div class="card stat"><small>आज का खर्च</small><b id="dayExpense" class="red">₹0</b></div>
<div class="card stat"><small>आज तक दिया</small><b id="dayPaid">₹0</b></div>
<div class="card stat"><small>आज बचा</small><b id="daySave" class="green">₹0</b></div>
</div>
<div class="actions"><button class="primary" onclick="cashForm('income')">＋ कमाई जोड़ें</button><button class="soft" onclick="cashForm('expense')">− खर्च जोड़ें</button></div>
<div class="card"><div class="title">🧾 हाल के रिकॉर्ड</div><div id="recent"></div></div>
</section>
<section id="customers" class="page">
<div class="actions"><button class="primary" onclick="customerForm()">＋ ग्राहक जोड़ें</button><button class="soft" onclick="report()">📊 रिपोर्ट</button></div>
<input id="search" class="search" placeholder="नाम, मोबाइल या पता खोजें..." oninput="renderCustomers()">
<div id="customerList"></div>
</section>
<section id="settings" class="page">
<div class="card"><div class="title">💾 Backup / Restore</div>
<p class="note">अपने डेटा का बैकअप समय-समय पर डाउनलोड करके सुरक्षित रखें। Restore करने पर वर्तमान डेटा बदल जाएगा।</p>
<button class="primary" style="width:100%;margin:8px 0" onclick="backup()">⬇️ Backup डाउनलोड</button>
<button class="soft" style="width:100%" onclick="document.getElementById('restoreFile').click()">⬆️ Backup Restore</button>
<input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)">
</div>
<div class="card"><div class="title">📝 दैनिक नोट</div><textarea id="dailyNote" rows="4" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"></textarea><button class="primary" style="width:100%;margin-top:8px" onclick="saveNote()">नोट सेव करें</button></div>
<div class="card"><button class="danger" style="width:100%" onclick="clearAll()">सारा डेटा हटाएँ</button></div>
</section>
</main>
<nav class="bottom">
<button class="nav on" data-p="home" onclick="page('home')">⌂ होम</button>
<button class="nav" data-p="customers" onclick="page('customers')">👤 ग्राहक</button>
<button class="nav" data-p="settings" onclick="page('settings')">⚙️ सेटिंग्स</button>
</nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="sheet" class="sheet"></div></div>
<script>
'use strict';
const KEY='MR_MONEY_FINAL_2026_V4';
const LEGACY=['MR_MONEY_FINAL_2026','MR_MONEY','HISAB_APP','hisabData'];
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const num=x=>{const n=Number(x);return Number.isFinite(n)&&n>0?n:0};
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
function now(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
const day=x=>String(x||'').slice(0,10);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fresh(){return{schema:'MRMONEY',version:4,customers:[],cash:[],dailyNote:''}}
function normTx(t){return{id:String(t.id||uid()),type:['payment','deposit','paid','jama'].includes(t.type)?'payment':'sale',amount:num(t.amount??t.value??t.money),date:String(t.date||t.datetime||t.createdAt||now()),note:String(t.note||t.remark||'')}}
function normCash(x){return{id:String(x.id||uid()),type:x.type==='expense'?'expense':'income',amount:num(x.amount??x.value??x.money),date:String(x.date||x.datetime||x.createdAt||now()),note:String(x.note||x.remark||x.description||''),category:String(x.category||'')}}
function normalize(x){
 const d=fresh();if(!x||typeof x!=='object')return d;
 d.customers=Array.isArray(x.customers)?x.customers.map(c=>({id:String(c.id||uid()),name:String(c.name||c.customerName||'बिना नाम'),phone:String(c.phone||c.mobile||c.number||''),address:String(c.address||''),opening:num(c.opening??c.oldBalance??c.previousBalance),photo:String(c.photo||c.image||''),tx:Array.isArray(c.tx)?c.tx.map(normTx):Array.isArray(c.transactions)?c.transactions.map(normTx):[]})):[];
 d.cash=Array.isArray(x.cash)?x.cash.map(normCash):Array.isArray(x.records)?x.records.filter(r=>r&&['income','expense'].includes(r.type)).map(normCash):[];
 d.dailyNote=String(x.dailyNote||x.note||'');return d;
}
function load(){
 for(const k of [KEY,...LEGACY]){
  try{const raw=localStorage.getItem(k);if(raw){const d=normalize(JSON.parse(raw));if(d.customers.length||d.cash.length||d.dailyNote){if(k!==KEY)localStorage.setItem(KEY,JSON.stringify(d));return d}}}catch(e){}
 }
 return fresh();
}
let db=load();
function save(){
 try{db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));return true}
 catch(e){alert('डेटा सेव नहीं हुआ। मोबाइल में जगह खाली करें और तुरंत Backup लें।');return false}
}
function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function fmt(s){try{return new Date(s).toLocaleString('hi-IN',{dateStyle:'medium',timeStyle:'short'})}catch(e){return s}}
function balance(c){return num(c.opening)+(c.tx||[]).reduce((a,t)=>a+(t.type==='sale'?num(t.amount):-((t.type==='payment')?num(t.amount):0)),0)}
function paidAll(){return db.customers.reduce((a,c)=>a+(c.tx||[]).filter(t=>t.type==='payment').reduce((s,t)=>s+num(t.amount),0),0)}
function dueAll(){return db.customers.reduce((a,c)=>a+Math.max(0,balance(c)),0)}
function cashSum(type,d){return db.cash.filter(x=>x.type===type&&day(x.date)===d).reduce((a,x)=>a+num(x.amount),0)}
function txSum(type,d){return db.customers.reduce((a,c)=>a+(c.tx||[]).filter(t=>t.type===type&&day(t.date)===d).reduce((s,t)=>s+num(t.amount),0),0)}
function page(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.p===p));render()}
function openM(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeM(){$('modal').classList.remove('show')}
function render(){
 const d=day(now());
 $('totPaid').textContent=money(paidAll());$('totDue').textContent=money(dueAll());
 $('dayIncome').textContent=money(cashSum('income',d));$('dayExpense').textContent=money(cashSum('expense',d));
 $('dayPaid').textContent=money(txSum('payment',d));$('daySave').textContent=money(cashSum('income',d)-cashSum('expense',d));
 renderRecent();renderCustomers();$('dailyNote').value=db.dailyNote||'';
}
function renderRecent(){
 const a=[];
 db.cash.forEach(x=>a.push({id:x.id,date:x.date,label:x.type==='income'?'कमाई':'खर्च',amount:x.amount,kind:'cash'}));
 db.customers.forEach(c=>(c.tx||[]).forEach(t=>a.push({id:t.id,date:t.date,label:(t.type==='payment'?'जमा किया':'रुपये का हिसाब')+' — '+c.name,amount:t.amount,kind:'tx',cid:c.id})));
 a.sort((x,y)=>new Date(y.date)-new Date(x.date));
 const list=a.slice(0,12);
 $('recent').innerHTML=list.length?list.map(x=>`<div class="record"><div><b>${esc(x.label)}</b><small>${fmt(x.date)}</small></div><div class="record-actions"><b>${money(x.amount)}</b><button class="mini" onclick="${x.kind==='cash'?`editCash('${x.id}')`:`editTx('${x.cid}','${x.id}')`}">Edit</button><button class="mini red" onclick="${x.kind==='cash'?`deleteCash('${x.id}')`:`deleteTx('${x.cid}','${x.id}')`}">हटाएँ</button></div></div>`).join(''):'<div class="empty">अभी कोई रिकॉर्ड नहीं है। कमाई या खर्च जोड़ें।</div>';
}
function renderCustomers(){
 const q=($('search').value||'').trim().toLowerCase();
 const a=db.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||c.phone.toLowerCase().includes(q)||c.address.toLowerCase().includes(q));
 $('customerList').innerHTML=a.length?a.map(c=>`<button class="customer" onclick="profile('${c.id}')"><div class="info"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.phone||'मोबाइल नहीं')} · ${esc(c.address||'पता नहीं')}</div></div><div class="bal"><small>बाकी</small><b class="${balance(c)<=0?'green':'red'}">${money(Math.max(0,balance(c)))}</b></div></button>`).join(''):'<div class="card empty">कोई ग्राहक नहीं मिला।</div>';
}
function customerForm(id=''){
 const c=id?db.customers.find(x=>x.id===id):null;
 openM(`<h2>${c?'ग्राहक Edit':'नया ग्राहक'}</h2><div class="field"><label>नाम *</label><input id="cn" value="${esc(c?.name||'')}"></div><div class="field"><label>मोबाइल</label><input id="cp" inputmode="tel" value="${esc(c?.phone||'')}"></div><div class="field"><label>पता</label><textarea id="ca">${esc(c?.address||'')}</textarea></div><div class="field"><label>पहले से बाकी रुपये</label><input id="co" type="number" min="0" value="${c?.opening||0}"></div><div class="modalBtns"><button class="soft" onclick="closeM()">रद्द</button><button class="primary" onclick="saveCustomer('${id}')">सेव करें</button></div>`);
}
function saveCustomer(id){
 const name=$('cn').value.trim();if(!name){alert('ग्राहक का नाम लिखें');return}
 const obj={name,phone:$('cp').value.trim(),address:$('ca').value.trim(),opening:num($('co').value)};
 if(id){const c=db.customers.find(x=>x.id===id);if(!c)return;Object.assign(c,obj)}
 else db.customers.push({id:uid(),...obj,photo:'',tx:[]});
 if(save()){closeM();render();toast('ग्राहक सेव हो गया')}
}
function profile(id){
 const c=db.customers.find(x=>x.id===id);if(!c)return;
 const tx=[...(c.tx||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
 openM(`<h2>👤 ${esc(c.name)}</h2><p>${esc(c.phone)}<br>${esc(c.address)}</p><div class="grid"><div class="card"><small>पहले से बाकी</small><b>${money(c.opening)}</b></div><div class="card"><small>कुल बाकी</small><b class="red">${money(Math.max(0,balance(c)))}</b></div><div class="card"><small>कुल जमा</small><b class="green">${money((c.tx||[]).filter(t=>t.type==='payment').reduce((s,t)=>s+t.amount,0))}</b></div></div><div class="actions"><button class="primary" onclick="txForm('${id}','sale')">＋ रुपये का हिसाब</button><button class="soft" onclick="txForm('${id}','payment')">＋ पैसा जमा</button></div><div class="actions"><button class="soft" onclick="customerForm('${id}')">ग्राहक Edit</button><button class="danger" onclick="delCustomer('${id}')">ग्राहक हटाएँ</button></div><h3>लेन-देन की हिस्ट्री</h3>${tx.length?tx.map(t=>`<div class="record"><div><b>${t.type==='payment'?'जमा किया':'रुपये का हिसाब'} — ${money(t.amount)}</b><small>${fmt(t.date)} ${esc(t.note)}</small></div><div class="record-actions"><button class="mini" onclick="editTx('${id}','${t.id}')">Edit</button><button class="mini red" onclick="deleteTx('${id}','${t.id}')">हटाएँ</button></div></div>`).join(''):'<div class="empty">अभी कोई लेन-देन नहीं है।</div>'}<div class="modalBtns"><button class="soft" onclick="closeM()">बंद करें</button></div>`);
}
function txForm(cid,type,tid=''){
 const c=db.customers.find(x=>x.id===cid),t=tid?(c?.tx||[]).find(x=>x.id===tid):null;
 openM(`<h2>${type==='payment'?'पैसा जमा':'रुपये का हिसाब'}</h2><div class="field"><label>रकम ₹</label><input id="ta" type="number" min="1" value="${t?.amount??''}"></div><div class="field"><label>तारीख और समय</label><input id="td" type="datetime-local" value="${t?.date||now()}"></div><div class="field"><label>नोट</label><input id="tn" value="${esc(t?.note||'')}"></div><div class="modalBtns"><button class="soft" onclick="profile('${cid}')">रद्द</button><button class="primary" onclick="saveTx('${cid}','${type}','${tid}')">सेव</button></div>`);
}
function editTx(cid,tid){const c=db.customers.find(x=>x.id===cid),t=c?.tx.find(x=>x.id===tid);if(t)txForm(cid,t.type,tid)}
function saveTx(cid,type,tid){
 const amount=num($('ta').value);if(!amount){alert('रकम लिखें');return}
 const c=db.customers.find(x=>x.id===cid);if(!c)return;c.tx=c.tx||[];
 const o={id:tid||uid(),type,amount,date:$('td').value||now(),note:$('tn').value.trim()};
 if(tid){const i=c.tx.findIndex(x=>x.id===tid);if(i<0)return;c.tx[i]=o}else c.tx.push(o);
 if(save()){profile(cid);render();toast('लेन-देन सेव हो गया')}
}
function deleteTx(cid,tid){if(!confirm('यह रिकॉर्ड हटाएँ?'))return;const c=db.customers.find(x=>x.id===cid);if(!c)return;c.tx=c.tx.filter(t=>t.id!==tid);if(save()){profile(cid);render();toast('रिकॉर्ड हटा दिया गया')}}
function delCustomer(cid){if(!confirm('ग्राहक और उसकी पूरी हिस्ट्री हट जाएगी। जारी रखें?'))return;db.customers=db.customers.filter(c=>c.id!==cid);if(save()){closeM();render()}}
function cashForm(type,id=''){
 const x=id?db.cash.find(z=>z.id===id):null;
 openM(`<h2>${type==='income'?'＋ कमाई जोड़ें':'− खर्च जोड़ें'}</h2><div class="field"><label>रकम ₹</label><input id="xa" type="number" min="1" value="${x?.amount??''}"></div><div class="field"><label>तारीख और समय</label><input id="xd" type="datetime-local" value="${x?.date||now()}"></div><div class="field"><label>श्रेणी</label><select id="xc"><option value="">चुनें</option>${['व्यापार','घर','यात्रा','खाना','बिल','अन्य'].map(s=>`<option ${x?.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>विवरण</label><input id="xn" value="${esc(x?.note||'')}"></div><div class="modalBtns"><button class="soft" onclick="closeM()">रद्द</button><button class="primary" onclick="saveCash('${type}','${id}')">सेव करें</button></div>`);
}
function editCash(id){const x=db.cash.find(z=>z.id===id);if(x)cashForm(x.type,id)}
function saveCash(type,id){
 const amount=num($('xa').value);if(!amount){alert('रकम लिखें');return}
 const o={id:id||uid(),type,amount,date:$('xd').value||now(),category:$('xc').value,note:$('xn').value.trim()};
 if(id){const i=db.cash.findIndex(x=>x.id===id);if(i<0)return;db.cash[i]=o}else db.cash.push(o);
 if(save()){closeM();render();toast('कमाई/खर्च सेव हो गया')}
}
function deleteCash(id){if(!confirm('यह कमाई/खर्च रिकॉर्ड हटाएँ?'))return;db.cash=db.cash.filter(x=>x.id!==id);if(save()){render();toast('रिकॉर्ड हटा दिया गया')}}
function report(){
 const a=[];db.cash.forEach(x=>a.push({date:x.date,label:x.type==='income'?'कमाई':'खर्च',amount:x.amount}));
 db.customers.forEach(c=>(c.tx||[]).forEach(t=>a.push({date:t.date,label:(t.type==='payment'?'जमा किया':'रुपये का हिसाब')+' — '+c.name,amount:t.amount})));
 a.sort((x,y)=>new Date(y.date)-new Date(x.date));
 openM('<h2>📊 पूरी रिपोर्ट</h2>'+`<p>कुल जमा: <b>${money(paidAll())}</b><br>कुल बाकी: <b>${money(dueAll())}</b></p>`+(a.length?a.map(x=>`<div class="record"><div>${esc(x.label)}<small>${fmt(x.date)}</small></div><b>${money(x.amount)}</b></div>`).join(''):'<div class="empty">कोई रिकॉर्ड नहीं।</div>')+'<div class="modalBtns"><button class="soft" onclick="closeM()">बंद करें</button></div>');
}
function backup(){
 const payload={magic:'MR_MONEY_BACKUP',app:'MR Money',version:4,exportedAt:new Date().toISOString(),data:db};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MR-Money-Backup-'+day(now())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup डाउनलोड शुरू हुआ');
}
function restoreBackup(e){
 const f=e.target.files?.[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const x=JSON.parse(r.result);let source=x.magic==='MR_MONEY_BACKUP'?x.data:(x.data||x.backup||x);
  if(!source||(!Array.isArray(source.customers)&&!Array.isArray(source.cash)))throw Error('invalid');
  const d=normalize(source);
  if(!confirm(`Restore करें?\nग्राहक: ${d.customers.length}\nकमाई/खर्च रिकॉर्ड: ${d.cash.length}\nग्राहक लेन-देन: ${d.customers.reduce((n,c)=>n+c.tx.length,0)}\n\nयह मौजूदा डेटा की जगह लेगा।`))return;
  db=d;if(save()){render();toast('Backup Restore हो गया')}
 }catch(err){alert('यह Backup फ़ाइल पढ़ी नहीं जा सकी। सही MR Money JSON फ़ाइल चुनें।')}finally{e.target.value=''}};
 r.readAsText(f);
}
function saveNote(){db.dailyNote=$('dailyNote').value;if(save())toast('नोट सेव हो गया')}
function clearAll(){if(confirm('सारा डेटा हट जाएगा। क्या आप निश्चित हैं?')){db=fresh();if(save()){render();toast('सारा डेटा हट गया')}}}
render();
</script>
