<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#078a50">
<title>MR Money</title>
<style>
:root{--g:#078a50;--g2:#e8f7ef;--r:#d83b3b;--bg:#f4f8f6;--ink:#142019;--muted:#718078;--line:#dce8e1;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari",Arial,sans-serif;padding-bottom:82px}button,input,textarea,select{font:inherit}button{border:0}.top{background:linear-gradient(135deg,#078f54,#087647);color:#fff;padding:32px 18px 25px;border-radius:0 0 30px 30px}.top h1{margin:0;font-size:35px}.top p{margin:5px 0 0;font-size:16px}.wrap{max-width:900px;margin:auto;padding:15px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 22px #123b2510}.stat small{color:var(--muted);font-size:14px}.stat b{display:block;font-size:26px;margin-top:5px}.green{color:var(--g)}.red{color:var(--r)}.title{font-size:23px;font-weight:800;margin:18px 2px 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}.btn{padding:14px;border-radius:15px;font-weight:800}.primary{background:var(--g);color:#fff}.soft{background:var(--g2);color:var(--g)}.danger{background:#fdecec;color:var(--r)}.search{width:100%;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:0;margin:5px 0 12px}.list{display:grid;gap:10px}.customer{background:#fff;border:1px solid var(--line);border-radius:19px;padding:13px;display:flex;align-items:center;gap:12px}.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--g2);display:grid;place-items:center;font-size:25px;flex:none}.info{min-width:0;flex:1}.name{font-weight:800;font-size:18px}.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bal{text-align:right}.bal small{display:block;color:var(--muted)}.bal b{font-size:19px;color:var(--r)}.zero{color:var(--g)!important}.record{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty{text-align:center;color:var(--muted);padding:25px}.chartbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px}.charttabs{display:flex;gap:7px;margin-bottom:12px}.charttabs button{flex:1;padding:10px;border-radius:12px;background:#edf3ef;color:#466057;font-weight:700}.charttabs button.on{background:var(--g);color:#fff}.chart{height:190px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line);padding:8px 2px 0;overflow:hidden}.barcol{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;min-width:10px}.bar{width:45%;border-radius:5px 5px 0 0;min-height:2px}.bar.in{background:#18a56b}.bar.out{background:#e05a5a}.chartlabels{display:flex;gap:6px}.chartlabels span{flex:1;text-align:center;font-size:9px;color:var(--muted);overflow:hidden}.legend{font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav{background:#fff;color:#68756e;border-radius:13px;padding:7px}.nav.on{background:var(--g2);color:var(--g);font-weight:800}.nav span{display:block;font-size:22px}.nav small{font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:27px 27px 0 0;padding:20px}.sheet h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;outline:0;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1}.modalBtns{display:flex;gap:8px;margin-top:15px}.modalBtns button{flex:1}.photo{width:105px;height:105px;border-radius:50%;object-fit:cover;display:block;margin:7px auto}.note{background:#fff9dc;border:1px solid #eadf9c;border-radius:13px;padding:10px;font-size:13px}
@media(min-width:700px){.sheet{max-width:650px;border-radius:27px}.modal{align-items:center}}
</style>
</head>
<body>
<header class="top"><h1>💰 MR Money</h1><p>आपका पूरा रुपये का हिसाब</p></header>

<main class="wrap">
<section id="home" class="page active">
<div class="grid">
<div class="card stat"><small>कुल जमा हुआ</small><b id="totPaid" class="green">₹0</b></div>
<div class="card stat"><small>कुल बचा है</small><b id="totDue" class="red">₹0</b></div>
<div class="card stat"><small>आज की कमाई</small><b id="dayIncome" class="green">₹0</b></div>
<div class="card stat"><small>आज का खर्च</small><b id="dayExpense" class="red">₹0</b></div>
<div class="card stat"><small>आज तक जमा</small><b id="dayPaid" class="green">₹0</b></div>
<div class="card stat"><small>आज बचा</small><b id="daySave" class="green">₹0</b></div>
</div>

<div class="title">📊 कमाई और खर्च</div>
<div class="chartbox">
<div class="charttabs"><button id="tbDay" class="on" onclick="setChart('day')">Daily</button><button id="tbWeek" onclick="setChart('week')">Weekly</button><button id="tbMonth" onclick="setChart('month')">Monthly</button></div>
<div id="chart"></div>
<div class="legend"><i style="background:#18a56b"></i>कमाई &nbsp;&nbsp;<i style="background:#e05a5a"></i>खर्च</div>
</div>

<div class="actions"><button class="btn primary" onclick="cashForm('income')">＋ कमाई जोड़ें</button><button class="btn soft" onclick="cashForm('expense')">− खर्च जोड़ें</button></div>
<div class="card"><div class="title" style="margin-top:0">हाल के रिकॉर्ड</div><div id="recent"></div></div>
</section>

<section id="customers" class="page">
<div class="actions"><button class="btn primary" onclick="customerForm()">＋ ग्राहक जोड़ें</button><button class="btn soft" onclick="report()">📊 रिपोर्ट</button></div>
<input id="search" class="search" placeholder="🔎 नाम या मोबाइल खोजें..." oninput="customers()">
<div id="customerList" class="list"></div>
</section>

<section id="settings" class="page">
<div class="card"><div class="title" style="margin-top:0">💾 Backup / Restore</div>
<button class="btn primary" style="width:100%;margin-bottom:8px" onclick="backup()">⬇️ Backup डाउनलोड</button>
<button class="btn soft" style="width:100%" onclick="document.getElementById('restore').click()">⬆️ Backup Restore</button>
<input id="restore" type="file" accept=".json" hidden onchange="restore(event)">
</div>
<div class="card" style="margin-top:12px"><div class="title" style="margin-top:0">📝 दैनिक नोट</div><textarea id="dailyNote" rows="5" placeholder="आज की जरूरी बात..."></textarea><button class="btn primary" style="width:100%;margin-top:8px" onclick="saveNote()">नोट सेव करें</button></div>
<div class="card" style="margin-top:12px"><button class="btn danger" style="width:100%" onclick="clearAll()">सारा डेटा हटाएँ</button></div>
</section>
</main>

<nav class="bottom"><button class="nav on" data-p="home" onclick="page('home')"><span>⌂</span><small>होम</small></button><button class="nav" data-p="customers" onclick="page('customers')"><span>👤</span><small>ग्राहक</small></button><button class="nav" data-p="settings" onclick="page('settings')"><span>⚙️</span><small>सेटिंग्स</small></button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="sheet" class="sheet"></div></div>

<script>
const KEY='MR_MONEY_FINAL_2026';
let db=load(),chartMode='day',photo='';
function fresh(){return{customers:[],cash:[],dailyNote:''}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.customers&&x.cash?x:fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function m(n){return'₹'+Math.round(Number(n)||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function dateOnly(x){return x.slice(0,10)}
function balance(c){return Number(c.opening||0)+(c.tx||[]).reduce((a,t)=>a+(t.type==='sale'?+t.amount:-(t.type==='payment'?+t.amount:0)),0)}
function paidAll(){return db.customers.reduce((a,c)=>a+(c.tx||[]).filter(t=>t.type==='payment').reduce((s,t)=>s+ +t.amount,0),0)}
function dueAll(){return db.customers.reduce((a,c)=>a+Math.max(0,balance(c)),0)}
function cash(type,d){return db.cash.filter(x=>x.type===type&&dateOnly(x.date)===d).reduce((a,x)=>a+ +x.amount,0)}
function txSum(type,d){return db.customers.reduce((a,c)=>a+(c.tx||[]).filter(t=>t.type===type&&dateOnly(t.date)===d).reduce((s,t)=>s+ +t.amount,0),0)}
function page(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.p===p));render()}
function openM(x){document.getElementById('sheet').innerHTML=x;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function render(){
let d=dateOnly(now());totPaid.textContent=m(paidAll());totDue.textContent=m(dueAll());dayIncome.textContent=m(cash('income',d));dayExpense.textContent=m(cash('expense',d));dayPaid.textContent=m(txSum('payment',d));daySave.textContent=m(cash('income',d)-cash('expense',d));document.getElementById('dailyNote').value=db.dailyNote||'';recentRecords();customers();drawChart()}
function recentRecords(){
let a=[];db.cash.forEach(x=>a.push({date:x.date,type:x.type,amount:x.amount,label:x.type==='income'?'कमाई':'खर्च',note:x.note}));db.customers.forEach(c=>(c.tx||[]).forEach(t=>a.push({date:t.date,type:t.type,amount:t.amount,label:(t.type==='payment'?'जमा':'रुपये दिए')+' — '+c.name,note:t.note})));a.sort((x,y)=>new Date(y.date)-new Date(x.date));
recent.innerHTML=a.slice(0,10).map(x=>`<div class="record"><div><b>${esc(x.label)}</b><small>${new Date(x.date).toLocaleString('hi-IN')}${x.note?' · '+esc(x.note):''}</small></div><b class="${x.type==='expense'||x.type==='sale'?'red':'green'}">${x.type==='expense'||x.type==='sale'?'−':'+'}${m(x.amount)}</b></div>`).join('')||'<div class="empty">अभी कोई रिकॉर्ड नहीं।</div>'
}
function customers(){
let q=(document.getElementById('search')?.value||'').toLowerCase().trim();let a=db.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));
customerList.innerHTML=a.map(c=>{let b=balance(c),p=(c.tx||[]).filter(t=>t.type==='payment').reduce((s,t)=>s+ +t.amount,0);return`<div class="customer" onclick="profile('${c.id}')">${c.photo?`<img class="avatar" src="${c.photo}">`:'<div class="avatar">👤</div>'}<div class="info"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.phone||'मोबाइल नहीं')} · जमा ${m(p)}</div></div><div class="bal"><small>बाकी</small><b class="${b>0?'':'zero'}">${m(Math.max(0,b))}</b></div></div>`}).join('')||'<div class="card empty">कोई ग्राहक नहीं मिला।</div>'
}
function customerForm(cid=''){
let c=cid?db.customers.find(x=>x.id===cid):null;photo=c?.photo||'';
openM(`<h2>${c?'ग्राहक Edit':'नया ग्राहक'}</h2><div class="field"><label>नाम *</label><input id="cn" value="${esc(c?.name||'')}" placeholder="नाम"></div><div class="field"><label>मोबाइल नंबर</label><input id="cp" value="${esc(c?.phone||'')}" inputmode="tel" placeholder="मोबाइल"></div><div class="field"><label>पता</label><textarea id="ca" rows="3" placeholder="पूरा पता">${esc(c?.address||'')}</textarea></div><div class="field"><label>पहले से बाकी ₹</label><input id="co" type="number" min="0" value="${c?.opening??0}"></div><div class="field"><label>ग्राहक फोटो</label><img id="pv" class="photo" src="${photo||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22105%22 height=%22105%22%3E%3Crect width=%22105%22 height=%22105%22 fill=%22%23e8f7ef%22/%3E%3Ctext x=%2252%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2250%22%3E👤%3C/text%3E%3C/svg%3E'}"><input type="file" accept="image/*" onchange="photoPick(event)"></div><div class="modalBtns"><button class="btn soft" onclick="closeM()">रद्द</button><button class="btn primary" onclick="saveCustomer('${cid}')">💾 सेव करें</button></div>`)
}
function photoPick(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;pv.src=photo};r.readAsDataURL(f)}
function saveCustomer(cid){
let n=cn.value.trim();if(!n){alert('नाम लिखें');return}let obj={name:n,phone:cp.value.trim(),address:ca.value.trim(),opening:+co.value||0};if(cid){let c=db.customers.find(x=>x.id===cid);Object.assign(c,obj);if(photo)c.photo=photo}else db.customers.push({...obj,id:id(),photo:photo,tx:[]});photo='';save();closeM();render()
}
function profile(cid){
let c=db.customers.find(x=>x.id===cid),b=balance(c),paid=(c.tx||[]).filter(t=>t.type==='payment').reduce((s,t)=>s+ +t.amount,0),tx=[...(c.tx||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
openM(`<h2>👤 ${esc(c.name)}</h2><div class="grid"><div class="stat"><small>पहले से बाकी</small><b>${m(c.opening)}</b></div><div class="stat"><small>कुल जमा</small><b class="green">${m(paid)}</b></div><div class="stat"><small>कुल बचा</small><b class="red">${m(Math.max(0,b))}</b></div><div class="stat"><small>आज जमा</small><b class="green">${m(txSum('payment',dateOnly(now())))}</b></div></div><div class="card" style="margin-top:10px"><div class="sub">मोबाइल</div><b>${esc(c.phone||'नहीं')}</b><div class="sub" style="margin-top:8px">पता</div><b>${esc(c.address||'नहीं')}</b></div><div class="actions"><button class="btn primary" onclick="txForm('${cid}','sale')">＋ रुपये दिए</button><button class="btn soft" onclick="txForm('${cid}','payment')">＋ पैसा जमा</button></div><div class="actions"><button class="btn soft" onclick="customerForm('${cid}')">✏️ Edit</button><button class="btn danger" onclick="delCustomer('${cid}')">🗑️ Delete</button></div><div class="title">पूरी हिस्ट्री</div>${tx.map(t=>`<div class="record"><div><b>${t.type==='payment'?'जमा किया':'रुपये दिए'} ${m(t.amount)}</b><small>${new Date(t.date).toLocaleString('hi-IN')}${t.note?' · '+esc(t.note):''}</small></div><button class="link" style="background:none;color:var(--g)" onclick="txForm('${cid}','${t.type}','${t.id}')">Edit</button></div>`).join('')||'<div class="empty">कोई रिकॉर्ड नहीं।</div>'}<div class="modalBtns"><button class="btn soft" onclick="closeM()">बंद करें</button></div>`)
}
function txForm(cid,type,tid=''){
let c=db.customers.find(x=>x.id===cid),t=tid?c.tx.find(x=>x.id===tid):null;
openM(`<h2>${type==='payment'?'💵 पैसा जमा':'🧾 रुपये का हिसाब'}</h2><div class="note">उदाहरण: ₹500 रुपये का हिसाब + ₹300 जमा = ₹200 बाकी।</div><div class="field"><label>रुपये ₹</label><input id="ta" type="number" min="0" value="${t?.amount??''}" inputmode="decimal"></div><div class="field"><label>तारीख और समय</label><input id="td" type="datetime-local" value="${t?.date||now()}"></div><div class="field"><label>नोट</label><input id="tn" value="${esc(t?.note||'')}" placeholder="जरूरी जानकारी"></div><div class="modalBtns"><button class="btn soft" onclick="profile('${cid}')">रद्द</button><button class="btn primary" onclick="saveTx('${cid}','${type}','${tid}')">💾 सेव</button></div>`)
}
function saveTx(cid,type,tid){
let a=+ta.value||0;if(a<=0){alert('रकम लिखें');return}let c=db.customers.find(x=>x.id===cid),o={id:tid||id(),type,amount:a,date:td.value||now(),note:tn.value.trim()};c.tx=c.tx||[];if(tid)c.tx[c.tx.findIndex(x=>x.id===tid)]=o;else c.tx.push(o);save();profile(cid);render()
}
function delCustomer(cid){if(confirm('इस ग्राहक की पूरी हिस्ट्री भी हट जाएगी। जारी रखें?')){db.customers=db.customers.filter(c=>c.id!==cid);save();closeM();render()}}
function cashForm(type){
openM(`<h2>${type==='income'?'＋ कमाई जोड़ें':'− खर्च जोड़ें'}</h2><div class="field"><label>रुपये ₹</label><input id="xa" type="number" min="0" inputmode="decimal"></div><div class="field"><label>तारीख और समय</label><input id="xd" type="datetime-local" value="${now()}"></div><div class="field"><label>विवरण</label><input id="xn" placeholder="${type==='income'?'कमाई कहाँ से आई':'खर्च किस चीज़ पर हुआ'}"></div><div class="modalBtns"><button class="btn soft" onclick="closeM()">रद्द</button><button class="btn primary" onclick="saveCash('${type}')">💾 सेव</button></div>`)
}
function saveCash(type){let a=+xa.value||0;if(a<=0){alert('रकम लिखें');return}db.cash.push({id:id(),type,amount:a,date:xd.value||now(),note:xn.value.trim()});save();closeM();render()}
function periodData(){
let out=[];
if(chartMode==='day'){for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10);out.push({label:d.toLocaleDateString('hi-IN',{day:'2-digit',month:'2-digit'}),income:cash('income',k),expense:cash('expense',k)})}}
if(chartMode==='week'){for(let i=7;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i*7);let end=new Date(d);end.setDate(end.getDate()+6);let inc=0,ex=0;for(let z=new Date(d);z<=end;z.setDate(z.getDate()+1)){let k=z.toISOString().slice(0,10);inc+=cash('income',k);ex+=cash('expense',k)}out.push({label:i===0?'इस सप्ताह':(i+' सप्ताह'),income:inc,expense:ex})}}
if(chartMode==='month'){for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let y=d.getFullYear(),mo=d.getMonth(),days=new Date(y,mo+1,0).getDate(),inc=0,ex=0;for(let j=1;j<=days;j++){let k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(j).padStart(2,'0');inc+=cash('income',k);ex+=cash('expense',k)}out.push({label:d.toLocaleDateString('hi-IN',{month:'short'}),income:inc,expense:ex})}}
return out
}
function setChart(x){chartMode=x;tbDay.classList.toggle('on',x==='day');tbWeek.classList.toggle('on',x==='week');tbMonth.classList.toggle('on',x==='month');drawChart()}
function drawChart(){let a=periodData(),mx=Math.max(1,...a.map(x=>Math.max(x.income,x.expense)));chart.innerHTML='<div class="chart">'+a.map(x=>`<div class="barcol" title="${x.label}: कमाई ${m(x.income)}, खर्च ${m(x.expense)}"><div class="bar in" style="height:${x.income/mx*100}%"></div><div class="bar out" style="height:${x.expense/mx*100}%"></div></div>`).join('')+'</div><div class="chartlabels">'+a.map(x=>`<span>${x.label}</span>`).join('')+'</div>'}
function report(){let a=[];db.cash.forEach(x=>a.push({date:x.date,label:x.type==='income'?'कमाई':'खर्च',amount:x.amount,type:x.type}));db.customers.forEach(c=>(c.tx||[]).forEach(t=>a.push({date:t.date,label:(t.type==='payment'?'जमा':'रुपये दिए')+' — '+c.name,amount:t.amount,type:t.type})));a.sort((x,y)=>new Date(y.date)-new Date(x.date));openM('<h2>📊 पूरी रिपोर्ट</h2>'+a.map(x=>`<div class="record"><div><b>${esc(x.label)}</b><small>${new Date(x.date).toLocaleString('hi-IN')}</small></div><b>${m(x.amount)}</b></div>`).join('')||'<div class="empty">कोई रिकॉर्ड नहीं।</div>')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='MR-Money-Backup.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.cash)throw 0;if(confirm('मौजूदा डेटा की जगह Backup डालना है?')){db=x;save();render();alert('Backup Restore हो गया')}}catch(z){alert('गलत Backup file है')}};r.readAsText(f);e.target.value=''}
function saveNote(){db.dailyNote=document.getElementById('dailyNote').value;save();alert('नोट सेव हो गया')}
function clearAll(){if(confirm('सारा डेटा हट जाएगा। पहले Backup लें। जारी रखें?')){db=fresh();save();render()}}
render();
</script>
</body>
</html>
