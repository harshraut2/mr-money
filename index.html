<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b8f55">
<title>MR Money — हिसाब</title>
<style>
:root{--g:#0b8f55;--gl:#e7f7ef;--ink:#142019;--muted:#728078;--bg:#f3f7f5;--line:#dce6e1;--red:#d83b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari",Arial,sans-serif}
header{background:var(--g);color:#fff;padding:22px 18px 19px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:30px}header p{margin:4px 0 0;opacity:.9}
main{max-width:900px;margin:auto;padding:16px 15px 105px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:#fff;border-radius:21px;padding:17px;box-shadow:0 5px 20px #15382b0d}.label{color:var(--muted);font-size:15px}.num{font-size:28px;font-weight:850;margin-top:6px}.green{color:var(--g)}.red{color:var(--red)}
h2{font-size:26px;margin:22px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;border:0;border-radius:16px;padding:14px;font-weight:750;cursor:pointer}.primary{background:var(--g);color:#fff}.soft{background:var(--gl);color:var(--g)}.danger{background:#fff0f0;color:var(--red)}
.search,input,select,textarea{font:inherit}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;margin-bottom:9px}
.customer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;margin:9px 0}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--gl);display:grid;place-items:center;flex:none}.ci{flex:1}.ci b{font-size:18px}.ci small,.muted{color:var(--muted);display:block;margin-top:3px}.balance{font-weight:850;color:var(--red);text-align:right}
.recent{background:#fff;border-radius:18px;padding:4px 15px}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottom button{background:#fff;color:#68756f;padding:8px}.bottom button.active{background:var(--gl);color:var(--g)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:700px;margin:auto;max-height:93vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px}.field{margin:11px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile{display:flex;align-items:center;gap:13px}.profile .avatar{width:74px;height:74px;font-size:28px}.bigbalance{font-size:35px;font-weight:900;color:var(--red);margin:8px 0 16px}.history{padding:12px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:28px}.settings-row{background:#fff;border-radius:18px;padding:17px;margin:10px 0}.report-date{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;width:100%}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{padding:20px}.sheet{border-radius:25px}}
</style>
</head>
<body>
<header><h1>💰 MR Money</h1><p>आपका पूरा रुपये का हिसाब</p></header>
<main id="main"></main>
<nav class="bottom">
<button id="navHome" class="active" onclick="home()">⌂<br>होम</button>
<button id="navCustomer" onclick="customers()">👤<br>ग्राहक</button>
<button id="navSettings" onclick="settings()">⚙️<br>सेटिंग्स</button>
</nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

<script>
const KEY="mr_money_final";
let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"income":[],"expense":[],"settings":{}}');
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("hi-IN",{day:"2-digit",month:"short",year:"numeric"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function nav(which){["navHome","navCustomer","navSettings"].forEach(x=>$(x).classList.remove("active"));$("nav"+which).classList.add("active")}
function openModal(){ $("modal").classList.add("show") } function closeModal(){ $("modal").classList.remove("show");window.photo=null }
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}

function customerTotals(c){
 let given=c.transactions.filter(x=>x.type==="given").reduce((s,x)=>s+Number(x.amount),0);
 let paid=c.transactions.filter(x=>x.type==="paid").reduce((s,x)=>s+Number(x.amount),0);
 return {given,paid,old:Number(c.old||0),balance:Math.max(0,Number(c.old||0)+given-paid)}
}
function allGiven(){return db.customers.reduce((s,c)=>s+customerTotals(c).given,0)}
function allPaid(){return db.customers.reduce((s,c)=>s+customerTotals(c).paid,0)}
function allOld(){return db.customers.reduce((s,c)=>s+Number(c.old||0),0)}
function allBalance(){return db.customers.reduce((s,c)=>s+customerTotals(c).balance,0)}
function todaySum(arr){return arr.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.amount),0)}

function home(){
 nav("Home");
 let inc=todaySum(db.income), exp=todaySum(db.expense), given=todaySum(db.customers.flatMap(c=>c.transactions.filter(x=>x.type==="given"))), paid=todaySum(db.customers.flatMap(c=>c.transactions.filter(x=>x.type==="paid")));
 let recent=[];
 db.income.forEach(x=>recent.push({kind:"कमाई",amount:x.amount,date:x.date,note:x.note,sign:"+"}));
 db.expense.forEach(x=>recent.push({kind:"खर्च",amount:x.amount,date:x.date,note:x.note,sign:"-"}));
 db.customers.forEach(c=>c.transactions.forEach(x=>recent.push({kind:x.type==="given"?"ग्राहक को दिए":"ग्राहक से जमा",amount:x.amount,date:x.date,note:c.name,sign:x.type==="given"?"+":"-"})));
 recent.sort((a,b)=>b.date.localeCompare(a.date));recent=recent.slice(0,8);
 $("main").innerHTML=`
 <div class="grid">
  <div class="card"><div class="label">कुल जमा हुआ</div><div class="num green">${money(allPaid())}</div></div>
  <div class="card"><div class="label">कुल बचा है</div><div class="num red">${money(allBalance())}</div></div>
  <div class="card"><div class="label">कुल दिए</div><div class="num">${money(allGiven()+allOld())}</div></div>
  <div class="card"><div class="label">पुराना बाकी</div><div class="num">${money(allOld())}</div></div>
 </div>
 <h2>आज का हिसाब</h2>
 <div class="grid">
  <div class="card"><div class="label">कमाई</div><div class="num green">${money(inc)}</div></div>
  <div class="card"><div class="label">खर्च</div><div class="num red">${money(exp)}</div></div>
  <div class="card"><div class="label">आज तक दिया</div><div class="num">${money(given)}</div></div>
  <div class="card"><div class="label">आज बचा</div><div class="num green">${money(inc-exp)}</div></div>
 </div>
 <div class="actions"><button class="primary" onclick="incomeForm()">＋ कमाई जोड़ें</button><button class="danger" onclick="expenseForm()">− खर्च जोड़ें</button></div>
 <h2>हाल के रिकॉर्ड</h2>
 <div class="recent">${recent.length?recent.map(x=>`<div class="record"><div><b>${esc(x.kind)}</b> ${x.sign} ${money(x.amount)}</div><small class="muted">${fmt(x.date)}${x.note?" · "+esc(x.note):""}</small></div>`).join(""):'<div class="empty">अभी कोई रिकॉर्ड नहीं है।</div>'}</div>
 <h2>ग्राहक + रिपोर्ट</h2>
 <div class="actions"><button class="soft" onclick="customers()">👤 ग्राहक देखें</button><button class="soft" onclick="report()">📊 रिपोर्ट देखें</button></div>`;
}

function customers(){
 nav("Customer");
 $("main").innerHTML=`<h2 style="margin-top:5px">ग्राहक</h2><button class="primary" style="width:100%;margin-bottom:12px" onclick="customerForm()">＋ नया ग्राहक</button><input id="cq" class="search" placeholder="🔎 नाम या मोबाइल खोजें" oninput="renderCustomers()"><div id="clist"></div>`;
 renderCustomers();
}
function renderCustomers(){
 let q=($("cq")?.value||"").toLowerCase(), list=db.customers.filter(c=>(c.name+" "+(c.phone||"")).toLowerCase().includes(q));
 $("clist").innerHTML=list.length?list.map(c=>{let t=customerTotals(c);return `<div class="customer" onclick="profile('${c.id}')">
 ${c.photo?`<img class="avatar" src="${c.photo}">`:`<div class="avatar">👤</div>`}
 <div class="ci"><b>${esc(c.name)}</b><small>${esc(c.phone||"मोबाइल नहीं")} · जमा ${money(t.paid)}</small></div>
 <div class="balance">बाकी<br>${money(t.balance)}</div></div>`}).join(""):'<div class="card empty">अभी कोई ग्राहक नहीं है।</div>';
}
function customerForm(id=null){
 let c=id?db.customers.find(x=>x.id===id):{name:"",phone:"",address:"",old:0,photo:""};
 $("sheet").innerHTML=`<h2>${id?"ग्राहक Edit":"नया ग्राहक"}</h2>
 <div class="field"><label>ग्राहक का नाम *</label><input id="cn" value="${esc(c.name)}"></div>
 <div class="field"><label>मोबाइल नंबर</label><input id="cp" value="${esc(c.phone||"")}" inputmode="tel"></div>
 <div class="field"><label>पहले से बाकी ₹</label><input id="cold" type="number" min="0" value="${Number(c.old||0)}"><small class="muted">पुराना बचा हुआ पैसा यहाँ लिखें।</small></div>
 <div class="field"><label>पता</label><input id="ca" value="${esc(c.address||"")}"></div>
 <div class="field"><label>फोटो</label><input id="cf" type="file" accept="image/*" onchange="photoPreview(event)"><img id="cpv" class="avatar" style="width:85px;height:85px;${c.photo?"":"display:none"}" src="${c.photo||""}"></div>
 <div class="two"><button class="soft" onclick="closeModal()">रद्द करें</button><button class="primary" onclick="saveCustomer('${id||""}')">💾 सेव करें</button></div>`;
 openModal();window.photo=c.photo||"";
}
function photoPreview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window.photo=r.result;$("cpv").src=r.result;$("cpv").style.display="block"};r.readAsDataURL(f)}
function saveCustomer(id){
 let name=$("cn").value.trim();if(!name)return alert("नाम लिखें");
 let c=id?db.customers.find(x=>x.id===id):{id:uid(),transactions:[]};
 c.name=name;c.phone=$("cp").value.trim();c.old=Number($("cold").value||0);c.address=$("ca").value.trim();c.photo=window.photo||"";
 if(!id)db.customers.push(c);save();closeModal();profile(c.id);
}
function profile(id){
 let c=db.customers.find(x=>x.id===id),t=customerTotals(c),todayGiven=c.transactions.filter(x=>x.type==="given"&&x.date===today()).reduce((s,x)=>s+Number(x.amount),0),todayPaid=c.transactions.filter(x=>x.type==="paid"&&x.date===today()).reduce((s,x)=>s+Number(x.amount),0);
 $("sheet").innerHTML=`<div class="profile">${c.photo?`<img class="avatar" src="${c.photo}">`:`<div class="avatar">👤</div>`}<div><h2 style="margin:0">${esc(c.name)}</h2><span class="muted">${esc(c.phone||"")} ${c.address?"· "+esc(c.address):""}</span></div></div>
 <div class="card" style="margin-top:15px"><div class="label">कुल बाकी</div><div class="bigbalance">${money(t.balance)}</div><div class="muted">पहले से बाकी ${money(t.old)} + नया दिया ${money(t.given)} − जमा ${money(t.paid)}</div></div>
 <div class="grid">
  <div class="card"><div class="label">आज कितना दिया</div><div class="num">${money(todayGiven)}</div></div>
  <div class="card"><div class="label">आज कितना जमा किया</div><div class="num green">${money(todayPaid)}</div></div>
  <div class="card"><div class="label">कुल दिया</div><div class="num">${money(t.old+t.given)}</div></div>
  <div class="card"><div class="label">कुल जमा</div><div class="num green">${money(t.paid)}</div></div>
 </div>
 <div class="actions"><button class="primary" onclick="txForm('${id}','given')">＋ रुपये दें</button><button class="soft" onclick="txForm('${id}','paid')">✓ रुपये जमा</button></div>
 <button class="soft" style="width:100%;margin-bottom:10px" onclick="customerForm('${id}')">✎ ग्राहक Edit</button>
 <h3>पूरी भुगतान हिस्ट्री</h3>
 ${c.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="history"><div><b>${x.type==="given"?"रुपये दिए":"रुपये जमा"} — ${money(x.amount)}</b></div><small class="muted">${fmt(x.date)} · ${x.time||"समय नहीं"}${x.note?" · "+esc(x.note):""}</small><button class="danger" style="padding:8px 11px;margin-top:7px" onclick="deleteTx('${id}','${x.id}')">हटाएँ</button></div>`).join("")||'<div class="empty">अभी कोई भुगतान नहीं है।</div>'}
 <button class="soft" style="width:100%;margin-top:10px" onclick="closeModal()">बंद करें</button>`;
 openModal();
}
function txForm(cid,type){
 $("sheet").innerHTML=`<h2>${type==="given"?"रुपये दिए":"रुपये जमा"}</h2><div class="field"><label>रुपये *</label><input id="ta" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="two"><div class="field"><label>तारीख</label><input id="td" type="date" value="${today()}"></div><div class="field"><label>समय</label><input id="tt" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><div class="field"><label>नोट</label><input id="tn" placeholder="नकद / UPI आदि"></div><div class="two"><button class="soft" onclick="profile('${cid}')">रद्द करें</button><button class="primary" onclick="saveTx('${cid}','${type}')">सेव करें</button></div>`;openModal()
}
function saveTx(cid,type){let a=Number($("ta").value);if(!(a>0))return alert("रुपये की राशि डालें");let c=db.customers.find(x=>x.id===cid);c.transactions.push({id:uid(),type,amount:a,date:$("td").value,time:$("tt").value,note:$("tn").value.trim()});save();profile(cid)}
function deleteTx(cid,tid){if(!confirm("यह रिकॉर्ड हटाएँ?"))return;let c=db.customers.find(x=>x.id===cid);c.transactions=c.transactions.filter(x=>x.id!==tid);save();profile(cid)}

function incomeForm(){
 $("sheet").innerHTML=`<h2>＋ कमाई जोड़ें</h2><div class="field"><label>रुपये *</label><input id="ia" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="two"><div class="field"><label>तारीख</label><input id="id" type="date" value="${today()}"></div><div class="field"><label>समय</label><input id="it" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><div class="field"><label>विवरण</label><input id="in" placeholder="कमाई का विवरण"></div><button class="primary" style="width:100%" onclick="saveIncome()">💾 सेव करें</button>`;openModal()
}
function saveIncome(){let a=Number($("ia").value);if(!(a>0))return alert("रुपये की राशि डालें");db.income.push({id:uid(),amount:a,date:$("id").value,time:$("it").value,note:$("in").value.trim()});save();closeModal();home()}
function expenseForm(){
 $("sheet").innerHTML=`<h2>− खर्च जोड़ें</h2><div class="field"><label>रुपये *</label><input id="ea" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="two"><div class="field"><label>तारीख</label><input id="ed" type="date" value="${today()}"></div><div class="field"><label>समय</label><input id="et" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><div class="field"><label>विवरण</label><input id="en" placeholder="खर्च का विवरण"></div><button class="primary" style="width:100%" onclick="saveExpense()">💾 सेव करें</button>`;openModal()
}
function saveExpense(){let a=Number($("ea").value);if(!(a>0))return alert("रुपये की राशि डालें");db.expense.push({id:uid(),amount:a,date:$("ed").value,time:$("et").value,note:$("en").value.trim()});save();closeModal();home()}

function report(){
 nav("Home");let d=today(), income=todaySum(db.income),expense=todaySum(db.expense),given=todaySum(db.customers.flatMap(c=>c.transactions.filter(x=>x.type==="given"))),paid=todaySum(db.customers.flatMap(c=>c.transactions.filter(x=>x.type==="paid")));
 $("main").innerHTML=`<h2 style="margin-top:5px">📊 रिपोर्ट</h2><div class="field"><label>तारीख</label><input class="report-date" type="date" value="${d}" onchange="reportFor(this.value)"></div><div id="reportBox"></div>`;reportFor(d)
}
function reportFor(d){
 let income=db.income.filter(x=>x.date===d).reduce((s,x)=>s+Number(x.amount),0),expense=db.expense.filter(x=>x.date===d).reduce((s,x)=>s+Number(x.amount),0),given=db.customers.flatMap(c=>c.transactions).filter(x=>x.type==="given"&&x.date===d).reduce((s,x)=>s+Number(x.amount),0),paid=db.customers.flatMap(c=>c.transactions).filter(x=>x.type==="paid"&&x.date===d).reduce((s,x)=>s+Number(x.amount),0);
 $("reportBox").innerHTML=`<div class="grid"><div class="card"><div class="label">कमाई</div><div class="num green">${money(income)}</div></div><div class="card"><div class="label">खर्च</div><div class="num red">${money(expense)}</div></div><div class="card"><div class="label">ग्राहक को दिए</div><div class="num">${money(given)}</div></div><div class="card"><div class="label">ग्राहक से जमा</div><div class="num green">${money(paid)}</div></div></div><div class="card"><b>आज बचा</b><div class="num green">${money(income-expense)}</div></div>`
}

function settings(){
 nav("Settings");
 $("main").innerHTML=`<h2 style="margin-top:5px">⚙️ सेटिंग्स</h2>
 <div class="settings-row"><b>💾 Backup</b><p class="muted">अपने पूरे हिसाब की कॉपी फोन में सुरक्षित रखें।</p><button class="primary" style="width:100%" onclick="backup()">Backup डाउनलोड करें</button></div>
 <div class="settings-row"><b>♻️ Restore</b><p class="muted">पहले बनाई Backup फाइल वापस ऐप में डालें।</p><input id="restoreFile" type="file" accept=".json,application/json" onchange="restore(this)"></div>
 <div class="settings-row"><b>📊 रिपोर्ट</b><p class="muted">दिन के हिसाब से कमाई, खर्च और ग्राहक भुगतान देखें।</p><button class="soft" style="width:100%" onclick="report()">रिपोर्ट खोलें</button></div>
 <div class="settings-row"><b>डेटा</b><p class="muted">${db.customers.length} ग्राहक · ${db.income.length+db.expense.length} आय/खर्च रिकॉर्ड</p></div>`
}
function backup(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MR-Money-Backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href)
}
function restore(input){
 let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.income||!x.expense)throw 0;if(confirm("पुराना डेटा Restore करें? मौजूदा डेटा बदल जाएगा।")){db=x;save();settings();alert("Restore सफल हुआ।")}}catch(e){alert("Backup फाइल सही नहीं है।")}};r.readAsText(f)
}
home();
</script>
</body>
</html>
