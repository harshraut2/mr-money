<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078b4f"><title>MR Money</title><style>:root{--g:#078b4f;--p:#e8f7f0;--r:#d83a3a;--ink:#15251d;--m:#718078;--bg:#f4f8f6;--line:#dce8e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari",Arial,sans-serif}.top{background:var(--g);color:white;padding:38px 22px 28px}.brand{font-size:38px;font-weight:800}.sub{font-size:20px}.wrap{max-width:900px;margin:auto;padding:18px 16px 110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.customer{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 24px #12331a0c}.stat label{color:var(--m);font-size:17px}.stat b{display:block;font-size:28px;margin-top:6px}.green{color:var(--g)}.red{color:var(--r)}h2{font-size:27px;margin:25px 2px 13px}.actions,.row{display:flex;gap:10px}.actions>*{flex:1}.btn{padding:15px;border-radius:17px;font-weight:800;background:var(--g);color:#fff}.btn.alt{background:var(--p);color:var(--g)}.btn.red{background:#fdecec;color:var(--r)}.search,.field input{width:100%;padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none}.customer{display:flex;align-items:center;gap:13px;margin-top:12px}.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:var(--p);display:grid;place-items:center;font-size:27px}.grow{flex:1}.cname{font-size:21px;font-weight:800}.small{font-size:14px;color:var(--m)}.due{text-align:right;color:var(--r);font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav{background:white;color:#68756f;padding:8px;border-radius:16px;font-weight:700}.nav.active{background:var(--p);color:var(--g)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.record{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--m);padding:28px}.hidden{display:none}.profile{display:flex;gap:14px;align-items:center}.big{width:78px;height:78px;border-radius:50%;object-fit:cover;background:var(--p);display:grid;place-items:center;font-size:34px}@media(max-width:600px){.grid{gap:9px}.stat b{font-size:25px}}</style></head><body><header class="top"><div class="brand">💰 MR Money</div><div class="sub">आपका पूरा रुपये का हिसाब</div></header><main class="wrap" id="app"></main><nav class="bottom"><button class="nav active" data-p="home">⌂<br>होम</button><button class="nav" data-p="customers">👤<br>ग्राहक</button><button class="nav" data-p="settings">⚙️<br>सेटिंग्स</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><input id="photo" type="file" accept="image/*" class="hidden"><script>
const K='mrMoneyV5';let db=JSON.parse(localStorage.getItem(K)||'{"customers":[],"records":[],"daily":[]}');db.customers??=[];db.records??=[];db.daily??[];let photo='';const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),m=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function save(){localStorage.setItem(K,JSON.stringify(db))}function due(c){return +c.opening+db.records.filter(r=>r.cid===c.id&&r.type==='credit').reduce((a,r)=>a+r.amount,0)-db.records.filter(r=>r.cid===c.id&&r.type==='payment').reduce((a,r)=>a+r.amount,0)}function daily(t,d=today()){return db.daily.filter(x=>x.type===t&&x.date===d).reduce((a,x)=>a+x.amount,0)}function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}function close(){ $('#modal').classList.remove('show') }$('#modal').onclick=e=>e.target.id==='modal'&&close();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(b.dataset.p));
function render(p='home'){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.p===p));p==='home'?home():p==='customers'?customers():settings()}
function home(){let inc=daily('income'),ex=daily('expense'),paid=db.records.filter(r=>r.date===today()&&r.type==='payment').reduce((a,r)=>a+r.amount,0);$('#app').innerHTML=`<div class="grid"><div class="card stat"><label>कुल जमा हुआ</label><b class="green">${m(db.records.filter(r=>r.type==='payment').reduce((a,r)=>a+r.amount,0))}</b></div><div class="card stat"><label>कुल बचा है</label><b class="red">${m(db.customers.reduce((a,c)=>a+Math.max(0,due(c)),0))}</b></div></div><h2>आज का हिसाब</h2><div class="grid"><div class="card stat"><label>आज की कमाई</label><b class="green">${m(inc)}</b></div><div class="card stat"><label>आज का खर्च</label><b class="red">${m(ex)}</b></div><div class="card stat"><label>आज तक दिया</label><b class="green">${m(paid)}</b></div><div class="card stat"><label>आज बचा</label><b class="${inc-ex>=0?'green':'red'}">${m(inc-ex)}</b></div></div><h2>त्वरित काम</h2><div class="actions"><button class="btn" onclick="dailyForm('income')">＋ कमाई जोड़ें</button><button class="btn alt" onclick="dailyForm('expense')">− खर्च जोड़ें</button></div><h2>हाल के रिकॉर्ड</h2><div class="card">${recent()}</div><h2>ग्राहक + रिपोर्ट</h2><div class="actions"><button class="btn alt" onclick="render('customers')">👤 ग्राहक</button><button class="btn alt" onclick="report()">📊 रिपोर्ट</button></div>`}function recent(){let a=[...db.records].sort((x,y)=>y.ts-x.ts).slice(0,8);return a.length?a.map(r=>{let c=db.customers.find(c=>c.id===r.cid);return `<div class="record"><div><b>${esc(c?.name||'हटाया गया')}</b><div class="small">${r.type==='payment'?'जमा':'रुपये बाकी'} · ${r.date} ${r.time||''}</div></div><b class="${r.type==='payment'?'green':'red'}">${r.type==='payment'?'+':'−'}${m(r.amount)}</b></div>`}).join(''):'<div class="empty">कोई रिकॉर्ड नहीं है।</div>'}
function customers(){ $('#app').innerHTML=`<div class="actions"><button class="btn" onclick="customerForm()">＋ ग्राहक जोड़ें</button><button class="btn alt" onclick="report()">📊 रिपोर्ट</button></div><input class="search" id="q" style="margin-top:14px" placeholder="🔎 नाम या मोबाइल खोजें..." oninput="list()"><div id="list"></div>`;list()}function list(){let q=($('#q')?.value||'').toLowerCase();let a=db.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));$('#list').innerHTML=a.length?a.map(c=>`<div class="customer" onclick="profile('${c.id}')"><img class="avatar" src="${c.photo||''}" onerror="this.style.display='none'"><div class="grow"><div class="cname">${esc(c.name)}</div><div class="small">${esc(c.phone||'मोबाइल नहीं')} · जमा ${m(db.records.filter(r=>r.cid===c.id&&r.type==='payment').reduce((a,r)=>a+r.amount,0))}</div></div><div class="due">बाकी<br>${m(Math.max(0,due(c)))}</div></div>`).join(''):'<div class="card empty">कोई ग्राहक नहीं है।</div>'}
function customerForm(id=''){let c=id?db.customers.find(x=>x.id===id):null;photo=c?.photo||'';modal(`<h2>${c?'ग्राहक Edit':'नया ग्राहक'}</h2><div class="field"><label>नाम *</label><input id="name" value="${esc(c?.name||'')}" placeholder="ग्राहक का नाम"></div><div class="field"><label>मोबाइल</label><input id="phone" value="${esc(c?.phone||'')}" inputmode="tel"></div><div class="field"><label>पहले से बाकी ₹</label><input id="opening" type="number" value="${c?.opening||0}"></div><button class="btn alt" onclick="$('#photo').click()">📷 फोटो चुनें</button><div class="small" id="pm">${c?.photo?'फोटो लगी है':''}</div><div class="row" style="margin-top:12px"><button class="btn alt" onclick="close()">रद्द</button><button class="btn" onclick="saveCustomer('${id}')">💾 सेव करें</button></div>${c?`<button class="btn red" style="width:100%;margin-top:10px" onclick="delCustomer('${id}')">🗑️ ग्राहक हटाएँ</button>`:''}`)}$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;$('#pm').textContent='फोटो चुन ली गई है'};r.readAsDataURL(f)};
function saveCustomer(id){let n=$('#name').value.trim(),ph=$('#phone').value.trim();if(!n)return alert('नाम लिखें');if(!id&&db.customers.some(c=>c.name.toLowerCase()===n.toLowerCase()&&c.phone===ph))return alert('यह ग्राहक पहले से सेव है');let c=id?db.customers.find(x=>x.id===id):{id:uid(),created:Date.now()};Object.assign(c,{name:n,phone:ph,opening:+$('#opening').value||0,photo});if(!id)db.customers.push(c);save();close();render('customers')}function delCustomer(id){let c=db.customers.find(x=>x.id===id);if(confirm('इस ग्राहक और उसके रिकॉर्ड को हटाएँ?')){db.customers=db.customers.filter(x=>x.id!==id);db.records=db.records.filter(r=>r.cid!==id);save();close();render('customers')}}
function profile(id){let c=db.customers.find(x=>x.id===id),rs=db.records.filter(r=>r.cid===id).sort((a,b)=>b.ts-a.ts),paid=rs.filter(r=>r.type==='payment').reduce((a,r)=>a+r.amount,0),todayPaid=rs.filter(r=>r.type==='payment'&&r.date===today()).reduce((a,r)=>a+r.amount,0);modal(`<div class="profile"><img class="big" src="${c.photo||''}" onerror="this.style.display='none'"><div><h2 style="margin:0">${esc(c.name)}</h2><div class="small">${esc(c.phone||'मोबाइल नहीं')}</div></div></div><div class="grid" style="margin-top:15px"><div class="card stat"><label>पहले से बाकी</label><b class="red">${m(c.opening)}</b></div><div class="card stat"><label>कुल जमा</label><b class="green">${m(paid)}</b></div><div class="card stat"><label>कुल बाकी</label><b class="red">${m(Math.max(0,due(c)))}</b></div><div class="card stat"><label>आज जमा</label><b class="green">${m(todayPaid)}</b></div></div><h2>आज कितना दिया / बाकी</h2><div class="actions"><button class="btn" onclick="tx('${id}','credit')">＋ रुपये बाकी</button><button class="btn alt" onclick="tx('${id}','payment')">₹ जमा किया</button></div><h2>पूरी हिस्ट्री</h2><div class="card">${rs.length?rs.map(r=>`<div class="record"><div><b>${r.type==='payment'?'जमा किया':'रुपये बाकी'}</b><div class="small">${r.date} ${r.time||''}${r.note?' · '+esc(r.note):''}</div></div><div><b class="${r.type==='payment'?'green':'red'}">${m(r.amount)}</b><br><button class="danger" onclick="delRecord('${r.id}','${id}')">हटाएँ</button></div></div>`).join(''):'<div class="empty">कोई लेन-देन नहीं।</div>'}</div><div class="row" style="margin-top:12px"><button class="btn alt" onclick="customerForm('${id}')">✏️ Edit</button><button class="btn alt" onclick="close()">बंद</button></div>`)}
function tx(cid,type){modal(`<h2>${type==='payment'?'₹ आज कितना जमा किया?':'₹ कितने रुपये बाकी हुए?'}</h2><div class="field"><label>राशि ₹</label><input id="amt" type="number" inputmode="decimal"></div><div class="field"><label>तारीख</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>समय</label><input id="time" type="time" value="${new Date().toTimeString().slice(0,5)}"></div><div class="field"><label>नोट</label><input id="note" placeholder="विवरण"></div><div class="row"><button class="btn alt" onclick="close()">रद्द</button><button class="btn" onclick="saveTx('${cid}','${type}')">सेव करें</button></div>`)}function saveTx(cid,type){let a=+$('#amt').value;if(!a)return alert('राशि डालें');db.records.push({id:uid(),cid,type,amount:a,date:$('#date').value,time:$('#time').value,note:$('#note').value.trim(),ts:Date.now()});save();profile(cid)}function delRecord(r,c){if(confirm('यह रिकॉर्ड हटाएँ?')){db.records=db.records.filter(x=>x.id!==r);save();profile(c)}}
function dailyForm(type){modal(`<h2>${type==='income'?'＋ कमाई जोड़ें':'− खर्च जोड़ें'}</h2><div class="field"><label>राशि ₹</label><input id="amt" type="number" inputmode="decimal"></div><div class="field"><label>तारीख</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>समय</label><input id="time" type="time" value="${new Date().toTimeString().slice(0,5)}"></div><div class="field"><label>विवरण</label><input id="note"></div><div class="row"><button class="btn alt" onclick="close()">रद्द</button><button class="btn" onclick="saveDaily('${type}')">सेव करें</button></div>`)}function saveDaily(type){let a=+$('#amt').value;if(!a)return alert('राशि डालें');db.daily.push({id:uid(),type,amount:a,date:$('#date').value,time:$('#time').value,note:$('#note').value,ts:Date.now()});save();close();render('home')}
function report(){let i=db.daily.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),e=db.daily.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);modal(`<h2>📊 रिपोर्ट</h2><div class="grid"><div class="card stat"><label>कुल कमाई</label><b class="green">${m(i)}</b></div><div class="card stat"><label>कुल खर्च</label><b class="red">${m(e)}</b></div></div><h2>दैनिक विवरण</h2><div class="card">${db.daily.length?[...db.daily].sort((a,b)=>b.ts-a.ts).map(x=>`<div class="record"><div><b>${x.type==='income'?'कमाई':'खर्च'}</b><div class="small">${x.date} ${x.time||''} · ${esc(x.note||'')}</div></div><b class="${x.type==='income'?'green':'red'}">${m(x.amount)}</b></div>`).join(''):'<div class="empty">कोई रिकॉर्ड नहीं।</div>'}</div><button class="btn alt" style="width:100%;margin-top:12px" onclick="close()">बंद करें</button>`)}
function settings(){$('#app').innerHTML=`<h2>⚙️ सेटिंग्स</h2><div class="card"><p><b>डेटा इसी iPhone में सेव है और ऑफलाइन भी चलता है।</b></p><div class="actions"><button class="btn" onclick="backup()">⬇️ Backup</button><button class="btn alt" onclick="$('#restore').click()">⬆️ Restore</button></div><input id="restore" type="file" accept=".json" class="hidden" onchange="restore(this.files[0])"><button class="btn red" style="width:100%;margin-top:12px" onclick="wipe()">सारा डेटा मिटाएँ</button></div>`}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mr-money-backup.json';a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.records)throw 0;db=x;save();render();alert('Restore हो गया')}catch(e){alert('Backup सही नहीं है')}};r.readAsText(f)}function wipe(){if(confirm('सारा डेटा मिट जाएगा। जारी रखें?')){db={customers:[],records:[],daily:[]};save();render()}}render();
</script></body></html>
